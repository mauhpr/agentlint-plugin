# AgentLint Configuration
# Docs: https://github.com/mauhpr/agentlint

stack: auto

severity: standard  # strict | standard | relaxed

packs:
  - universal
  - quality            # Always active: commit format, dead imports, error handling, self-review
  # - python          # Auto-detected from pyproject.toml / setup.py
  # - frontend        # Auto-detected from package.json
  # - react           # Auto-detected from react in dependencies
  # - seo             # Auto-detected from SSR/SSG framework
  # - security        # Opt-in: blocks Bash file writes, network exfiltration
  # - autopilot       # Opt-in: production guard, cloud/infra safety
  # - mypack          # Custom packs: add name here + set custom_rules_dir below

rules: {}
  # Override individual rules:
  # no-secrets:
  #   enabled: false
  # max-file-size:
  #   limit: 300
  #
  # CLI integration — run any external tool on PostToolUse:
  # cli-integration:
  #   commands:
  #     - name: ruff
  #       on: ["Write", "Edit"]
  #       glob: "**/*.py"
  #       command: "ruff check {file.path} --output-format=concise"
  #       timeout: 10
  #       severity: warning

# custom_rules_dir: .agentlint/rules/
# Custom rules with pack = "mypack" activate when "mypack" is listed in packs above

# AgentChute cloud dashboard and hybrid security feeds (opt-in)
# agentchute:
#   enabled: false
